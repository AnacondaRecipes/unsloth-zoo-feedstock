{% set name = "unsloth_zoo" %}
{% set version = "2026.10.11" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1f12582295cbcb1e7a505fb79cb5791e758889d038851f13385c03eafc0a52de

build:
  number: 0
  # Linux only: no cut_cross_entropy on win/osx-64; osx-arm64 uses upstream's mlx deps instead.
  # py3.10-3.14 (requires-python <3.15, cut_cross_entropy >=3.10); aarch64 from py3.11, where
  # triton and cut_cross_entropy start.
  skip: true  # [not (linux64 or aarch64) or py<310 or py>314 or (aarch64 and py<311)]
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    # pyproject.toml [build-system].requires
    - setuptools 84.2.1
    - setuptools-scm 10.3.4
  run:
    - python
    # pyproject.toml [project.dependencies] at 2026.10.11 (Linux bounds; the darwin-arm64
    # mlx/mlx-lm/mlx-vlm entries do not apply).
    - pytorch >=2.4.0,<2.16.0  # analint: cbc_dep_in_run_missing_from_host  # runtime-only, nothing links torch at build
    - torchao >=0.13.0  # analint: cbc_dep_in_run_missing_from_host  # runtime-only, nothing links it at build
    - triton >=3.0.0  # analint: cbc_dep_in_run_missing_from_host  # runtime-only, nothing links it at build
    - accelerate >=0.34.1
    - trl >=0.18.2,!=0.19.0,<=1.15.0
    - peft >=0.18.0,!=0.11.0
    - cut_cross_entropy
    - einops
    - packaging >=24.1
    - transformers >=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.17.0
    - datasets >=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0
    - sentencepiece >=0.2.0
    - tqdm
    - psutil
    - wheel >=0.42.0
    - numpy
    - protobuf
    - huggingface_hub >=0.34.0
    - hf-transfer
    - pillow
    - regex
    - msgspec
    - typing_extensions
    - filelock
    - requests
    - certifi >=2026.10.19
  # pyproject.toml [project.optional-dependencies].mlx (unmarked); the core/huggingface/base/
  # intelgpu extras only restate base deps (triton-windows is win32-only).
  run_constrained:
    - mlx ==0.32.4
    - mlx-lm >=0.31.3,<=0.32.2
    - mlx-vlm >=0.4.4,<=0.7.11

test:
  # `import unsloth_zoo` normally requires `unsloth` (circular dep) and a GPU init;
  # UNSLOTH_ZOO_DISABLE_GPU_INIT=1 (unsloth_zoo/__init__.py) skips both so the package can
  # be imported standalone. unsloth_zoo_downloads is stdlib-only at import time.
  imports:
    - unsloth_zoo_downloads
  commands:
    - pip check
    - UNSLOTH_ZOO_DISABLE_GPU_INIT=1 python -c "import unsloth_zoo; assert unsloth_zoo.__version__ == '{{ version }}', unsloth_zoo.__version__"
    # The import above skips torch; load the torch stack it runs on (CPU import only, no kernels).
    - python -c "import torch, torchao, triton, cut_cross_entropy"
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth-zoo
  # Core files are LGPL-3.0-or-later (LICENSE); COPYING is AGPL-3.0 and unsloth_zoo/pad_token.py
  # is AGPL-3.0-only. Vendored under unsloth_zoo/_vendored (see its NOTICE): fla-core 0.5.1
  # (MIT) and a vLLM Triton kernel (Apache-2.0).
  license: LGPL-3.0-or-later AND AGPL-3.0-only AND MIT AND Apache-2.0
  license_family: Other
  license_file:
    - LICENSE
    - COPYING
    - unsloth_zoo/_vendored/NOTICE
    - unsloth_zoo/_vendored/fla/LICENSE
    - unsloth_zoo/_vendored/vllm/LICENSE
  summary: Utilities for Unsloth
  description: |
    Unsloth Zoo provides the shared utilities, model-patching helpers, and
    training/optimization building blocks used by Unsloth to make LLM
    fine-tuning and reinforcement learning faster and more memory efficient.
  # upstream [project.urls] documentation points at the unsloth repo
  doc_url: https://github.com/unslothai/unsloth
  dev_url: https://github.com/unslothai/unsloth-zoo

extra:
  recipe-maintainers:
    - xkong-anaconda
