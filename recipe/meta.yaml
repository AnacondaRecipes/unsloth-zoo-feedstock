{% set name = "unsloth_zoo" %}
{% set version = "2026.6.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/unsloth_zoo-{{ version }}.tar.gz
  sha256: 6de86389640bde9afab5c770e5fc6de982b89a1d2179f7c5c4a6b057630c146e

build:
  number: 0
  # triton + cut_cross_entropy (hard runtime deps) are only available on linux-64 on pkgs/main
  skip: true  # [not linux64]
  # cut_cross_entropy requires python >=3.10
  skip: true  # [py<310]
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - python
    - pytorch >=2.4.0
    - torchao >=0.13.0
    - triton >=3.0.0
    - tyro
    - accelerate >=0.34.1
    - trl >=0.18.2
    - peft >=0.18.0
    - cut_cross_entropy
    - packaging >=24.1
    - transformers >=4.51.3
    - datasets >=3.4.1
    - sentencepiece >=0.2.0
    - tqdm
    - psutil
    - wheel >=0.42.0
    - numpy
    - protobuf
    - huggingface_hub >=0.34.0
    - hf-transfer
    - pillow
    - regex
    - msgspec
    - typing_extensions
    - filelock

test:
  # importing unsloth_zoo patches torch/transformers and expects a CUDA runtime,
  # so a bare import is not a reliable smoke test (mirrors conda-forge's unsloth recipe).
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/unslothai/unsloth-zoo
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: Utilities for Unsloth
  description: |
    Unsloth Zoo provides the shared utilities, model-patching helpers, and
    training/optimization building blocks used by Unsloth to make LLM
    fine-tuning and reinforcement learning faster and more memory efficient.
  doc_url: https://github.com/unslothai/unsloth-zoo
  dev_url: https://github.com/unslothai/unsloth-zoo

extra:
  skip-lints:
    # pytorch/torchao/triton are CBC-pinned runtime-only deps (pure-Python; not linked at build)
    - cbc_dep_in_run_missing_from_host
  recipe-maintainers:
    - xkong-anaconda
